<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FinanceOS — Personal Financial Management</title>
<meta name="description" content="Track income, expenses, budgets, debt, savings and net worth — works offline." />
<meta name="theme-color" content="#0B2545" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="FinanceOS" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div id="app">

  <!-- Top bar (mobile) -->
  <header class="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="Open menu">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="topbar-title">
      <span class="brand-mark">F</span>
      <span id="topbarLabel">Dashboard</span>
    </div>
    <button id="monthBtn" class="pill-btn" aria-label="Select month" title="Change active month"><span id="topbarMonth">—</span> <svg viewBox="0 0 24 24" style="width:12px;height:12px;margin-left:3px;display:inline-block;vertical-align:middle;stroke-width:2.2;"><path d="M6 9l6 6 6-6"/></svg></button>
  </header>

  <!-- Sidebar nav -->
  <nav id="sidebar" class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark">F</span>
      <div>
        <div class="brand-name">FinanceOS</div>
        <div class="brand-sub">Personal Financial Control</div>
      </div>
    </div>
    <ul class="nav-list" id="navList">
      <li><a href="#dashboard" data-view="dashboard"><svg viewBox="0 0 24 24"><path d="M3 13h4v8H3zM10 3h4v18h-4zM17 8h4v13h-4z"/></svg>Dashboard</a></li>
      <li><a href="#transactions" data-view="transactions"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Transactions</a></li>
      <li><a href="#budget" data-view="budget"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 10h16M10 10v10"/></svg>Budget</a></li>
      <li><a href="#recurring" data-view="recurring"><svg viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>Recurring</a></li>
      <li><a href="#cashflow" data-view="cashflow"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-8M14 8h6v6"/></svg>Cash Flow</a></li>
      <li><a href="#debt" data-view="debt"><svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Debt</a></li>
      <li><a href="#savings" data-view="savings"><svg viewBox="0 0 24 24"><path d="M12 2a9 9 0 100 18 9 9 0 000-18zM12 7v5l3 3"/></svg>Savings</a></li>
      <li><a href="#sinking" data-view="sinking"><svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M3 12h3M18 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/><circle cx="12" cy="12" r="4"/></svg>Sinking Funds</a></li>
      <li><a href="#accounts" data-view="accounts"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Accounts</a></li>
      <li><a href="#networth" data-view="networth"><svg viewBox="0 0 24 24"><path d="M3 3v18h18M7 15l4-4 3 3 5-6"/></svg>Net Worth</a></li>
      <li><a href="#settings" data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 11-4 0v-.09A1.7 1.7 0 009 19.4a1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.7 1.7 0 004.6 15a1.7 1.7 0 00-1.55-1H3a2 2 0 110-4h.09A1.7 1.7 0 004.6 9a1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06A1.7 1.7 0 009 4.6a1.7 1.7 0 001-1.55V3a2 2 0 114 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06A1.7 1.7 0 0019.4 9c.1.35.3.66.55.9"/></svg>Settings</a></li>
    </ul>
    <div class="sidebar-footer">
      <button id="installBtn" class="install-btn" hidden>Install App</button>
      <div class="sidebar-status" id="storageNote">Data stored on this device only</div>
    </div>
  </nav>
  <div id="scrim" class="scrim"></div>

  <!-- Main content -->
  <main id="main" class="main">
    <div id="view-root"></div>
  </main>

</div>

<!-- Mobile FAB -->
<button class="fab" id="fabAddTx" aria-label="Add transaction">
  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
</button>

<!-- Modal root -->
<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>

<script>
  window.FINANCEOS_API_BASE = window.FINANCEOS_API_BASE || '';
</script>
<script src="js/app.js"></script>
</body>
</html>
